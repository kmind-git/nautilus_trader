[package]
name = "nautilus-pyo3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false # Never publish to crates.io

[lints]
workspace = true

[lib]
name = "nautilus_pyo3"
crate-type = ["rlib", "cdylib"]

[features]
default = []
arrow = ["nautilus-serialization/arrow"]
extension-module = [
  "nautilus-analysis/extension-module",
  "nautilus-backtest/extension-module",
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-cryptography/extension-module",
  "nautilus-data/extension-module",
  "nautilus-execution/extension-module",
  "nautilus-indicators/extension-module",
  "nautilus-infrastructure/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "nautilus-portfolio/extension-module",
  "nautilus-persistence/extension-module",
  "nautilus-risk/extension-module",
  "nautilus-serialization/extension-module",
  "nautilus-testkit/extension-module",
  "nautilus-trading/extension-module",
  "pyo3/extension-module",
]
high-precision = [
  "nautilus-model/high-precision",
  "nautilus-serialization/high-precision",
  "nautilus-testkit/high-precision",
]
mimalloc = ["dep:mimalloc"]
postgres = ["nautilus-infrastructure/postgres"]
redis = ["nautilus-infrastructure/redis"]
tracing-bridge = ["nautilus-common/tracing-bridge"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-analysis = { workspace = true, features = ["python"] }
nautilus-backtest = { workspace = true, features = ["python", "examples"] }
nautilus-common = { workspace = true, features = ["python"] }
nautilus-core = { workspace = true, features = ["python"] }
nautilus-cryptography = { workspace = true, features = ["python"] }
nautilus-data = { workspace = true, features = ["python"] }
nautilus-execution = { workspace = true, features = ["python"] }
nautilus-indicators = { workspace = true, features = ["python"] }
nautilus-infrastructure = { workspace = true, features = ["python"] }
nautilus-live = { workspace = true, features = [
  "python",
  "examples",
  "plugin",
] }
nautilus-model = { workspace = true, features = ["python"] }
nautilus-network = { workspace = true, features = [
  "python",
  "transport-sockudo",
] }
nautilus-persistence = { workspace = true, features = ["python"] }
nautilus-portfolio = { workspace = true, features = ["python"] }
nautilus-risk = { workspace = true, features = ["python"] }
nautilus-serialization = { workspace = true, features = ["python"] }
nautilus-system = { workspace = true, features = ["python"] }
nautilus-testkit = { workspace = true, default-features = false, features = [
  "python",
] }
nautilus-trading = { workspace = true, features = ["python"] }

pyo3 = { workspace = true }
pyo3-stub-gen = { workspace = true }

# local_dynamic_tls avoids exhausting static TLS space when the extension is dlopen'd
[target.'cfg(target_os = "macos")'.dependencies]
# v2 avoids conflicting with PyArrow's independent mimalloc instance on macOS;
# remove it once libmimalloc-sys bundles native mimalloc v3.4.4 or later
mimalloc = { workspace = true, features = [
  "local_dynamic_tls",
  "v2",
], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { workspace = true, features = [
  "local_dynamic_tls",
], optional = true }

# Run with `cargo run --bin python-stub-gen`
[[bin]]
name = "python-stub-gen"
path = "bin/stub_gen.rs"
doc = false
test = false
